<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zeroFome — Protótipo</title>
  <meta name="description" content="Protótipo do zeroFome: visão do estabelecimento e visão do consumidor conectadas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/market.css">
  <link rel="stylesheet" href="assets/css/client.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>

  <header class="top">
    <div class="top-in">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </span>
        <span>zero<b>Fome</b></span>
      </div>
      <span class="badge-proto">Protótipo · dados fictícios</span>
      <nav class="seg" id="seg" aria-label="Visão">
        <button data-act="mudarModo" data-modo="split">Lado a lado</button>
        <button data-act="mudarModo" data-modo="mercado">Mercado</button>
        <button data-act="mudarModo" data-modo="cliente">Cliente</button>
      </nav>
      <button class="btn-reset" data-act="reiniciar" title="Volta a demonstração ao estado inicial">↺ Reiniciar</button>
    </div>
  </header>

  <section class="flow" aria-label="Fluxo do zeroFome">
    <div class="flow-steps" id="flow"></div>
    <div class="flow-log" id="flowlog"></div>
  </section>

  <main class="stage split" id="stage">
    <section class="col-market">
      <div class="col-label"><span class="dot market"></span>Visão do mercado · painel do estabelecimento</div>
      <div class="panel" id="market"></div>
    </section>

    <section class="col-client">
      <div class="col-label"><span class="dot client"></span>Visão do cliente · app do consumidor</div>
      <div class="phone">
        <div class="screen">
          <div class="notch"></div>
          <div class="sbar"><span>9:41</span><span>●●● 5G ▮</span></div>
          <button class="push" id="push" data-act="abrirPush"></button>
          <div class="app" id="app"></div>
          <nav class="tabbar" id="tabbar"></nav>
          <div class="sheet-bg" id="sheetbg" data-act="fecharSheet"></div>
          <div class="sheet" id="sheet"></div>
        </div>
      </div>
    </section>
  </main>

  <p class="foot">Protótipo de validação do zeroFome. Estabelecimentos, produtos, preços e a integração com o ERP são simulados. Nenhuma compra ou reserva real é feita.</p>

  <div id="modalroot"></div>
  <div class="toasts" id="toasts"></div>

</body>
</html>
